<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PIANO PRO - by Tama-ID</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.topbar{height:52px;background:#0a0a0a;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #222;flex-shrink:0}
.brand{font-weight:900;letter-spacing:2px;font-size:19px}
.brand span{color:#ffd700}
.credit{font-size:12px;opacity:.8;letter-spacing:.5px}
.credit b{color:#fff}
.menu{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#050505;scrollbar-width:none;flex-shrink:0}
.menu::-webkit-scrollbar{display:none}
.menu button{white-space:nowrap;padding:9px 14px;border-radius:999px;border:1px solid #2a2a2a;background:#111;color:#ddd;font-size:12px;cursor:pointer}
.menu button.active{background:#ffd700;color:#000;border-color:#ffd700;font-weight:800;box-shadow:0 0 18px rgba(255,215,0,.45)}
.now{padding:2px 14px 8px;font-size:11px;letter-spacing:1px;color:#aaa;text-transform:uppercase}
.now b{color:#ffd700}
.piano{flex:1;position:relative;background:#000;padding:0 6px 6px;display:flex}
.white-keys{display:flex;flex:1;gap:3px}
.white{flex:1;background:linear-gradient(180deg,#fff 0%,#f5f5f5 85%,#d9d9d9 100%);border-radius:0 0 10px 10px;position:relative;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;color:#111;font-weight:800;font-size:11px;box-shadow:inset 0 -4px 8px rgba(0,0,0,.15);transition:transform .05s,background .05s}
.white:active,.white.playing{background:#ffe97a;transform:translateY(2px)}
.white small{display:block;text-align:center;line-height:1.2}
.white small i{font-style:normal;font-size:9px;opacity:.55}
.black-keys{position:absolute;top:0;left:6px;right:6px;height:58%;pointer-events:none;display:flex}
.black-slot{flex:1;position:relative;pointer-events:none}
.black{position:absolute;top:0;left:50%;transform:translateX(-50%);width:62%;height:100%;background:linear-gradient(180deg,#222,#000);border-radius:0 0 7px 7px;border:1px solid #000;border-top:none;z-index:5;pointer-events:auto;cursor:pointer;box-shadow:0 6px 10px rgba(0,0,0,.6)}
.black:active,.black.playing{background:#333;transform:translateX(-50%) translateY(2px)}
.hint{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:11px;color:#888;pointer-events:none;z-index:1}
@media(max-width:600px){.brand{font-size:16px}.white{font-size:10px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">PIANO <span>PRO</span></div>
  <div class="credit">by <b>Tama-ID</b></div>
</div>
<div class="menu" id="menu"></div>
<div class="now">NOW PLAYING: <b id="nowTitle">passacaglia</b> • pencet tuts apa aja, iramanya tetep bener</div>
<div class="piano">
  <div class="white-keys" id="whites"></div>
  <div class="black-keys" id="blacks"></div>
  <div class="hint">PIANO PRO • by Tama-ID • Tap bebas, lagu jalan otomatis</div>
</div>

<script>
let ctx=null;
function audio(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); return ctx; }
function playNote(freq, dur=0.6, vol=0.35){
  try{
    const ac=audio(), t=ac.currentTime;
    const o=ac.createOscillator(), o2=ac.createOscillator(), g=ac.createGain();
    o.type='triangle'; o.frequency.value=freq;
    o2.type='sine'; o2.frequency.value=freq*2; 
    const g2=ac.createGain(); g2.gain.value=0.12;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(ac.destination);
    o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05);
  }catch(e){}
}
// frekuensi piano
const F={ 'A3':220,'A#3':233.08,'B3':246.94,'C4':261.63,'C#4':277.18,'D4':293.66,'D#4':311.13,'E4':329.63,'F4':349.23,'F#4':369.99,'G4':392,'G#4':415.3,'A4':440,'A#4':466.16,'B4':493.88,'C5':523.25,'C#5':554.37,'D5':587.33,'D#5':622.25,'E5':659.25,'F5':698.46,'F#5':739.99,'G5':783.99 };
const whites=[['A3','A3','kuning'],['B3','B3','hijau'],['C4','C4','biru'],['D4','D4','pink'],['E4','E4','ungu'],['F4','F4','tosca'],['G4','G4','orange'],['A4','A4','kuning'],['B4','B4','hijau'],['C5','C5','biru'],['D5','D5','pink'],['E5','E5','ungu'],['F5','F5','tosca'],['G5','G5','orange']];
const blackMap={'A3':'A#3','C4':'C#4','D4':'D#4','F4':'F#4','G4':'G#4','A4':'A#4','C5':'C#5','D5':'D#5','F5':'F#5'};

// DATA LAGU - pola irama, bukan nada asal
// Passacaglia: bass ostinato G minor yang muter
const passacaglia=[['G3',0.5],['F3',0.5],['D#3',0.5],['D3',0.5],['D#3',0.5],['F3',0.5],['G3',0.5],['G3',0.5],['G4',0.4],['A4',0.4],['A#4',0.4],['G4',0.4],['F4',0.5],['D4',0.5],['D#4',0.6],['F4',0.6]];
const laMaritza=[['E4',0.4],['G4',0.4],['A4',0.4],['G4',0.4],['E4',0.4],['D4',0.4],['E4',0.6],['G4',0.4],['A4',0.4],['C5',0.4],['B4',0.4],['A4',0.5],['G4',0.5],['E4',0.7]];
const guruku=[['C4',0.45],['D4',0.45],['E4',0.45],['F4',0.45],['G4',0.5],['E4',0.45],['F4',0.45],['G4',0.45],['A4',0.5],['G4',0.6],['F4',0.45],['E4',0.45],['D4',0.45],['C4',0.8]];
const waliYang=[['G4',0.4],['A4',0.4],['B4',0.4],['C5',0.4],['B4',0.4],['A4',0.4],['G4',0.5],['E4',0.4],['G4',0.4],['A4',0.4],['B4',0.6],['A4',0.5],['G4',0.8]];
const river=[['E5',0.5],['D5',0.4],['C5',0.4],['D5',0.4],['E5',0.5],['C5',0.4],['D5',0.4],['E5',0.6],['G4',0.5],['A4',0.5],['C5',0.6],['D5',0.8]];
const bintang=[['C4',0.4],['E4',0.4],['G4',0.4],['A4',0.4],['G4',0.4],['E4',0.4],['D4',0.5],['E4',0.4],['F4',0.4],['G4',0.5],['A4',0.6],['G4',0.8]];
const interstellar=[['C4',0.5],['E4',0.5],['G4',0.5],['A4',0.5],['G4',0.5],['E4',0.5],['D4',0.5],['E4',0.5],['F4',0.5],['A4',0.5],['G4',0.6],['C5',0.8]];

const songs=[
 {name:'passacaglia', seq:passacaglia},
 {name:'la maritza', seq:laMaritza},
 {name:'guruku tersayang', seq:guruku},
 {name:'guruku x passacaglia x la maritza', seq:[...guruku,...passacaglia,...laMaritza]},
 {name:'wali - yang', seq:waliYang},
 {name:'river flows in you', seq:river},
 {name:'bintang di surga', seq:bintang},
 {name:'interstellar', seq:interstellar},
];
let current=0, idx=0;
const menuEl=document.getElementById('menu');
songs.forEach((s,i)=>{
  const b=document.createElement('button'); b.textContent=s.name; if(i===0) b.classList.add('active');
  b.onclick=()=>{ current=i; idx=0; document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); document.getElementById('nowTitle').textContent=s.name; };
  menuEl.appendChild(b);
});
// Bass Passacaglia otomatis untuk lagu passacaglia & mashup
function playBass(){
  if(songs[current].name.includes('passacaglia') || songs[current].name.includes('guruku x')){
    playNote(196,0.5,0.12); // G3 bass
  }
}
function nextNote(){
  const seq=songs[current].seq;
  const [note,dur]=seq[idx % seq.length];
  // konversi note ke frekuensi, fallback ke F
  const freqMap={'C3':130.81,'D3':146.83,'D#3':155.56,'E3':164.81,'F3':174.61,'G3':196,'A3':220,'B3':246.94,'C4':261.63,'D4':293.66,'D#4':311.13,'E4':329.63,'F4':349.23,'G4':392,'A4':440,'A#4':466.16,'B4':493.88,'C5':523.25};
  playNote(freqMap[note]||440, dur+0.3, 0.32);
  playBass();
  idx++;
}
function pressKey(el, freq){
  el.classList.add('playing'); setTimeout(()=>el.classList.remove('playing'),220);
  nextNote();
}
// Build piano
const whitesEl=document.getElementById('whites');
const blacksEl=document.getElementById('blacks');
whites.forEach(([note,label])=>{
  const d=document.createElement('div'); d.className='white'; d.innerHTML=`<small>${label}<br><i>${note}</i></small>`;
  d.onclick=()=>pressKey(d,F[note]); whitesEl.appendChild(d);
  const slot=document.createElement('div'); slot.className='black-slot';
  if(blackMap[note]){
    const b=document.createElement('div'); b.className='black';
    b.onclick=(e)=>{e.stopPropagation(); pressKey(b,F[blackMap[note]]);};
    slot.appendChild(b);
  }
  blacksEl.appendChild(slot);
});
</script>
</body>
</html>
