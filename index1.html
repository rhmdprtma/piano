<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>PIANO PRO - by Tama-ID</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.topbar{height:60px;background:#0a0a0a;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #222;flex-shrink:0}
.brand-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;object-fit:contain;border-radius:8px;background:#171717;border:1px solid #333}
.brand{font-weight:900;letter-spacing:2px;font-size:19px;white-space:nowrap}
.brand span{color:#ffd700}
.credit{font-size:12px;opacity:.8;letter-spacing:.5px;white-space:nowrap}
.credit b{color:#fff}
.menu{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#050505;scrollbar-width:none;flex-shrink:0}
.menu::-webkit-scrollbar{display:none}
.menu button{white-space:nowrap;padding:9px 14px;border-radius:999px;border:1px solid #2a2a2a;background:#111;color:#ddd;font-size:12px;cursor:pointer}
.menu button.active{background:#ffd700;color:#000;border-color:#ffd700;font-weight:800;box-shadow:0 0 18px rgba(255,215,0,.3)}
.controls{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#080808;border-bottom:1px solid #1c1c1c;flex-shrink:0}
.controls button{padding:8px 14px;border-radius:9px;border:1px solid #333;background:#151515;color:#eee;font-weight:700;font-size:12px;cursor:pointer}
.controls button.primary{background:#ffd700;color:#000;border-color:#ffd700}
.controls button:disabled{opacity:.4;cursor:not-allowed}
.status{margin-left:auto;color:#999;font-size:10px;letter-spacing:.7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{padding:7px 14px 8px;font-size:11px;letter-spacing:1px;color:#aaa;text-transform:uppercase;flex-shrink:0}
.now b{color:#ffd700}
.piano{flex:1;min-height:0;position:relative;background:#000;padding:0 6px 6px;display:flex}
.white-keys{display:flex;flex:1;gap:3px}
.white{flex:1;min-width:0;background:linear-gradient(180deg,#fff 0%,#f5f5f5 85%,#d9d9d9 100%);border-radius:0 0 10px 10px;position:relative;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;color:#111;font-weight:800;font-size:11px;box-shadow:inset 0 -4px 8px rgba(0,0,0,.15);transition:transform .05s,background .05s;user-select:none}
.white:active,.white.playing{background:#ffe97a;transform:translateY(2px)}
.white small{display:block;text-align:center;line-height:1.2;pointer-events:none}
.white small i{font-style:normal;font-size:9px;opacity:.55}
.black-keys{position:absolute;top:0;left:6px;right:6px;height:58%;pointer-events:none;display:flex}
.black-slot{flex:1;position:relative;pointer-events:none}
.black{position:absolute;top:0;left:50%;transform:translateX(-50%);width:62%;height:100%;background:linear-gradient(180deg,#222,#000);border-radius:0 0 7px 7px;border:1px solid #000;border-top:none;z-index:5;pointer-events:auto;cursor:pointer;box-shadow:0 6px 10px rgba(0,0,0,.6);user-select:none}
.black:active,.black.playing{background:#555;transform:translateX(-50%) translateY(2px)}
.hint{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:11px;color:#888;pointer-events:none;z-index:1}
@media(max-width:600px){.brand{font-size:16px}.logo{width:34px;height:34px}.white{font-size:10px}.controls{gap:6px}.controls button{padding:8px 10px}.status{font-size:9px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand-wrap">
    <img class="logo" src="logo.jpg" alt="Logo Tama-ID" onerror="this.style.display='none'">
    <div class="brand">PIANO <span>PRO</span></div>
  </div>
  <div class="credit">by <b>Tama-ID</b></div>
</header>

<div class="menu" id="menu" aria-label="Pilihan lagu"></div>

<div class="controls">
  <button class="primary" id="playBtn" type="button">▶ PLAY</button>
  <button id="pauseBtn" type="button" disabled>Ⅱ PAUSE</button>
  <button id="stopBtn" type="button" disabled>■ STOP</button>
  <div class="status" id="status">SIAP DIMAINKAN</div>
</div>

<div class="now">NOW PLAYING: <b id="nowTitle">passacaglia</b></div>

<main class="piano">
  <div class="white-keys" id="whites"></div>
  <div class="black-keys" id="blacks"></div>
  <div class="hint">PIANO PRO • by Tama-ID • Auto lagu + piano manual</div>
</main>

<script>
'use strict';

let ctx = null;
let timer = null;
let current = 0;
let idx = 0;
let isPlaying = false;
let nextAt = 0;
let remainingMs = 0;
let songToken = 0;

function audio(){
  if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if(ctx.state === 'suspended') ctx.resume();
  return ctx;
}

function playNote(freq, dur=0.6, vol=0.35){
  try{
    const ac = audio();
    const t = ac.currentTime;
    const osc = ac.createOscillator();
    const overtone = ac.createOscillator();
    const gain = ac.createGain();
    const overtoneGain = ac.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    overtone.type = 'sine';
    overtone.frequency.setValueAtTime(freq * 2, t);
    overtoneGain.gain.setValueAtTime(0.10, t);

    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, t + Math.max(0.08, dur));

    osc.connect(gain);
    overtone.connect(overtoneGain);
    overtoneGain.connect(gain);
    gain.connect(ac.destination);

    osc.start(t);
    overtone.start(t);
    osc.stop(t + dur + 0.06);
    overtone.stop(t + dur + 0.06);
  }catch(err){
    console.warn('Audio tidak dapat diputar:', err);
  }
}

const F = {
  'A3':220,'A#3':233.08,'B3':246.94,'C4':261.63,'C#4':277.18,
  'D4':293.66,'D#4':311.13,'E4':329.63,'F4':349.23,'F#4':369.99,
  'G4':392,'G#4':415.3,'A4':440,'A#4':466.16,'B4':493.88,
  'C5':523.25,'C#5':554.37,'D5':587.33,'D#5':622.25,'E5':659.25,
  'F5':698.46,'F#5':739.99,'G5':783.99
};

const whites = [
  ['A3','A3'],['B3','B3'],['C4','C4'],['D4','D4'],['E4','E4'],['F4','F4'],['G4','G4'],
  ['A4','A4'],['B4','B4'],['C5','C5'],['D5','D5'],['E5','E5'],['F5','F5'],['G5','G5']
];
const blackMap = {
  'A3':'A#3','C4':'C#4','D4':'D#4','F4':'F#4','G4':'G#4',
  'A4':'A#4','C5':'C#5','D5':'D#5','F5':'F#5'
};

const passacaglia = [['G3',0.5],['F3',0.5],['D#3',0.5],['D3',0.5],['D#3',0.5],['F3',0.5],['G3',0.5],['G3',0.5],['G4',0.4],['A4',0.4],['A#4',0.4],['G4',0.4],['F4',0.5],['D4',0.5],['D#4',0.6],['F4',0.6]];
const laMaritza = [['E4',0.4],['G4',0.4],['A4',0.4],['G4',0.4],['E4',0.4],['D4',0.4],['E4',0.6],['G4',0.4],['A4',0.4],['C5',0.4],['B4',0.4],['A4',0.5],['G4',0.5],['E4',0.7]];
const guruku = [['C4',0.45],['D4',0.45],['E4',0.45],['F4',0.45],['G4',0.5],['E4',0.45],['F4',0.45],['G4',0.45],['A4',0.5],['G4',0.6],['F4',0.45],['E4',0.45],['D4',0.45],['C4',0.8]];
const waliYang = [['G4',0.4],['A4',0.4],['B4',0.4],['C5',0.4],['B4',0.4],['A4',0.4],['G4',0.5],['E4',0.4],['G4',0.4],['A4',0.4],['B4',0.6],['A4',0.5],['G4',0.8]];
const river = [['E5',0.5],['D5',0.4],['C5',0.4],['D5',0.4],['E5',0.5],['C5',0.4],['D5',0.4],['E5',0.6],['G4',0.5],['A4',0.5],['C5',0.6],['D5',0.8]];
const bintang = [['C4',0.4],['E4',0.4],['G4',0.4],['A4',0.4],['G4',0.4],['E4',0.4],['D4',0.5],['E4',0.4],['F4',0.4],['G4',0.5],['A4',0.6],['G4',0.8]];
const interstellar = [['C4',0.5],['E4',0.5],['G4',0.5],['A4',0.5],['G4',0.5],['E4',0.5],['D4',0.5],['E4',0.5],['F4',0.5],['A4',0.5],['G4',0.6],['C5',0.8]];

const songs = [
  {name:'passacaglia',seq:passacaglia},
  {name:'la maritza',seq:laMaritza},
  {name:'guruku tersayang',seq:guruku},
  {name:'guruku x passacaglia x la maritza',seq:[...guruku,...passacaglia,...laMaritza]},
  {name:'wali - yang',seq:waliYang},
  {name:'river flows in you',seq:river},
  {name:'bintang di surga',seq:bintang},
  {name:'interstellar',seq:interstellar}
];

const freqMap = {
  'C3':130.81,'D3':146.83,'D#3':155.56,'E3':164.81,'F3':174.61,'F#3':185,'G3':196,'G#3':207.65,'A3':220,'A#3':233.08,'B3':246.94,
  ...F
};
const menuEl = document.getElementById('menu');
const whitesEl = document.getElementById('whites');
const blacksEl = document.getElementById('blacks');
const nowTitle = document.getElementById('nowTitle');
const statusEl = document.getElementById('status');
const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');

function updateControls(){
  playBtn.disabled = isPlaying;
  pauseBtn.disabled = !isPlaying;
  stopBtn.disabled = !isPlaying && idx === 0;
  playBtn.textContent = idx > 0 && !isPlaying ? '▶ RESUME' : '▶ PLAY';
  statusEl.textContent = isPlaying ? '● AUTO PLAY BERJALAN' : (idx > 0 ? 'Ⅱ DIJEDA' : 'SIAP DIMAINKAN');
}

function highlightNote(note){
  const key = document.querySelector(`[data-note="${note}"]`);
  if(!key) return;
  key.classList.add('playing');
  window.setTimeout(()=>key.classList.remove('playing'),220);
}

function playBass(){
  const songName = songs[current].name;
  if(songName.includes('passacaglia')){
    playNote(98,0.42,0.10); // G2 bass, lembut
  }
}

function scheduleNext(waitMs=0){
  if(!isPlaying) return;
  const token = songToken;
  const seq = songs[current].seq;
  timer = window.setTimeout(()=>{
    if(!isPlaying || token !== songToken) return;
    const [note,dur] = seq[idx % seq.length];
    playNote(freqMap[note] || 440, dur + 0.18, 0.28);
    highlightNote(note);
    playBass();
    idx = (idx + 1) % seq.length;
    remainingMs = dur * 1000;
    nextAt = Date.now() + remainingMs;
    scheduleNext(remainingMs);
  }, Math.max(0, waitMs));
}

function startPlayback(){
  audio();
  if(isPlaying) return;
  isPlaying = true;
  songToken++;
  const wait = remainingMs;
  remainingMs = 0;
  scheduleNext(wait);
  updateControls();
}

function pausePlayback(){
  if(!isPlaying) return;
  remainingMs = Math.max(0, nextAt - Date.now());
  isPlaying = false;
  songToken++;
  window.clearTimeout(timer);
  updateControls();
}

function stopPlayback(){
  isPlaying = false;
  songToken++;
  window.clearTimeout(timer);
  remainingMs = 0;
  nextAt = 0;
  idx = 0;
  updateControls();
}

function selectSong(index, button){
  pausePlayback();
  current = index;
  idx = 0;
  document.querySelectorAll('.menu button').forEach(el=>el.classList.remove('active'));
  button.classList.add('active');
  nowTitle.textContent = songs[current].name;
  updateControls();
  startPlayback();
}

songs.forEach((song,index)=>{
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = song.name;
  if(index === 0) button.classList.add('active');
  button.addEventListener('click',()=>selectSong(index,button));
  menuEl.appendChild(button);
});

playBtn.addEventListener('click',startPlayback);
pauseBtn.addEventListener('click',pausePlayback);
stopBtn.addEventListener('click',stopPlayback);

function pressKey(el,note){
  audio();
  el.classList.add('playing');
  window.setTimeout(()=>el.classList.remove('playing'),150);
  playNote(freqMap[note] || 440,0.75,0.32);
  // Nada manual tidak mengubah indeks atau tempo lagu otomatis.
}

whites.forEach(([note,label])=>{
  const key = document.createElement('div');
  key.className = 'white';
  key.dataset.note = note;
  key.innerHTML = `<small>${label}<br><i>${note}</i></small>`;
  key.addEventListener('pointerdown',()=>pressKey(key,note));
  whitesEl.appendChild(key);

  const slot = document.createElement('div');
  slot.className = 'black-slot';
  if(blackMap[note]){
    const blackNote = blackMap[note];
    const black = document.createElement('div');
    black.className = 'black';
    black.dataset.note = blackNote;
    black.addEventListener('pointerdown',(event)=>{
      event.stopPropagation();
      pressKey(black,blackNote);
    });
    slot.appendChild(black);
  }
  blacksEl.appendChild(slot);
});

updateControls();
</script>
</body>
</html>
